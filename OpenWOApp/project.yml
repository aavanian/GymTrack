name: OpenWO
options:
  bundleIdPrefix: com.avanian
  deploymentTarget:
    iOS: "18.0"

packages:
  OpenWOKit:
    path: ../OpenWOKit

targets:
  OpenWOWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - OpenWOWatch
    dependencies:
      - package: OpenWOKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avanian.openwo.watchkitapp
        DEVELOPMENT_TEAM: 57YB623TNL
        INFOPLIST_KEY_CFBundleDisplayName: OpenWO
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.avanian.openwo
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHealthShareUsageDescription: "This app uses HealthKit to write workout sessions only. No health data is read or accessed."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "OpenWO records your workouts in Apple Health so they count toward your activity rings."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    entitlements:
      path: OpenWOWatch/OpenWOWatch.entitlements
      properties:
        com.apple.developer.healthkit: true

  OpenWO:
    type: application
    platform: iOS
    sources:
      - OpenWO
    dependencies:
      - package: OpenWOKit
      - target: OpenWOWatch
    settings:
      base:
        INFOPLIST_FILE: OpenWO/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenWO/OpenWO.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.avanian.openwo
        DEVELOPMENT_TEAM: 57YB623TNL
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_CFBundleDisplayName: OpenWO
        TARGETED_DEVICE_FAMILY: 1
    entitlements:
      path: OpenWO/OpenWO.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.avanian.openwo
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.avanian.openwo
        com.apple.developer.icloud-services:
          - CloudDocuments
    capabilities:
      HealthKit: true
      iCloud:
        services:
          - icloud-documents
        containerIdentifiers:
          - iCloud.com.avanian.openwo

  OpenWOTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenWOTests
    dependencies:
      - target: OpenWO

schemes:
  OpenWOWatch:
    build:
      targets:
        OpenWOWatch: all
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable

  OpenWO:
    build:
      targets:
        OpenWO: all
        OpenWOWatch: all
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    test:
      config: Debug
      targets:
        - OpenWOTests
    profile:
      config: Release
    archive:
      config: Release
